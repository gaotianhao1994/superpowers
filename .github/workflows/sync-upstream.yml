name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream ${{ vars.UPSTREAM_REPO_URL }}
          git remote -v

      - name: Fetch upstream branches
        run: git fetch upstream

      - name: Check if merge is needed
        id: check
        run: |
          BRANCH_NAME=main
          UPSTREAM_BRANCH=upstream/$BRANCH_NAME
          
          echo "Fetching latest from upstream..."
          git fetch upstream $BRANCH_NAME
          
          LOCAL_BRANCH=$(git rev-parse HEAD)
          UPSTREAM_LATEST=$(git rev-parse $UPSTREAM_BRANCH)
          
          if [ "$LOCAL_BRANCH" = "$UPSTREAM_LATEST" ]; then
            echo "Already up to date with upstream"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          else
            echo "Updates available from upstream"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
            echo "behind_commits=$(git rev-list --count HEAD..$UPSTREAM_BRANCH)" >> $GITHUB_OUTPUT
          fi

      - name: Sync with upstream
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          git merge upstream/main --no-edit
        continue-on-error: true

      - name: Push changes
        if: steps.check.outputs.needs_sync == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: false
